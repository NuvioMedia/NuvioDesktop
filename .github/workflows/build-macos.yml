name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [main, Dev]
    paths:
      - 'composeApp/**'
      - 'mediamp/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/setup-macos-libs.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Restore mpv macOS libs cache
        id: cache-mpv
        uses: actions/cache@v4
        with:
          path: MPVKit/dist
          key: mpv-macos-${{ matrix.arch }}-0.41.0-r12

      - name: Create local.properties for CI
        run: touch local.properties

      - name: Download mpv macOS libs
        if: steps.cache-mpv.outputs.cache-hit != 'true'
        run: bash scripts/setup-macos-libs.sh

      - name: Build native player bridge
        run: ./gradlew :composeApp:buildMacosPlayerBridge --no-daemon --no-configuration-cache

      - name: Package DMG
        run: ./gradlew :composeApp:packageDmg --no-daemon --no-configuration-cache

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-macOS-${{ matrix.arch }}
          path: composeApp/build/compose/binaries/**/*.dmg
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs-${{ matrix.arch }}
          path: |
            composeApp/build/reports/
            ~/.gradle/daemon/
          retention-days: 7
