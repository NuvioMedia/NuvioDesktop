          fi
          bash ./scripts/linux/verify-linux-rpm.sh "${rpm_path}"
          ls -lh "${rpm_path}"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-linux-rpm
          path: Nuvio-Linux-x86_64-${{ needs.metadata.outputs.version }}.rpm
          if-no-files-found: error
          retention-days: 14

  linux_appimage:
    name: Linux x64 - AppImage
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'linux')
    needs:
      - metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      APPIMAGE_TOOL_VERSION: 1.9.1
      APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install Linux AppImage build dependencies
        run: |
          bash ./scripts/linux/install-desktop-build-dependencies.sh zsync

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          bash ./scripts/linux/configure-desktop-runtime.sh

      - name: Build Linux AppImage
        shell: bash
        run: |
          set -euo pipefail

          appimagetool_path="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl -fsSL -o "${appimagetool_path}" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGE_TOOL_VERSION}/appimagetool-x86_64.AppImage"
            
          actual_sha256="$(sha256sum "${appimagetool_path}" | awk '{print $1}')"
          if [[ "${actual_sha256}" != "${APPIMAGETOOL_SHA256}" ]]; then
            echo "appimagetool checksum mismatch." >&2
            echo "Expected: ${APPIMAGETOOL_SHA256}" >&2
            echo "Actual:   ${actual_sha256}" >&2
            exit 1
          fi

          chmod +x "${appimagetool_path}"

          repo_owner="${GITHUB_REPOSITORY%%/*}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          update_information="gh-releases-zsync|${repo_owner}|${repo_name}|latest|Nuvio-Linux-x86_64-*.AppImage.zsync"

          export APPIMAGETOOL="${appimagetool_path}"
          export APPIMAGE_WEBSITE_URL="https://github.com/NuvioMedia/NuvioDesktop"

          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            export UPDATE_INFORMATION="${update_information}"
            export APPIMAGE_UPDATE_INFORMATION="${update_information}"
          fi

          ./gradlew \
            :composeApp:packageReleaseAppImage \
            :desktopSentry:sentryUploadSourceBundleJava \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

          appimage_dir="${GITHUB_WORKSPACE}/composeApp/build/compose/release-appimages"
          if [[ ! -d "${appimage_dir}" ]]; then
            echo "Expected published AppImage directory at ${appimage_dir}." >&2
            find composeApp/build/compose -maxdepth 8 2>/dev/null | head -n 300 >&2
            exit 1
          fi

          appimage_path="${appimage_dir}/Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"
          if [[ ! -f "${appimage_path}" ]]; then
            echo "Expected AppImage artifact was not produced: ${appimage_path}" >&2
            find "${appimage_dir}" -maxdepth 4 -type f | sort >&2 || true
            exit 1
          fi

          cp "${appimage_path}" "Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"
          chmod +x "Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"

          zsyncmake "Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"

      - name: Verify AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage_path="Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"
          zsync_path="Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage.zsync"
          if [[ ! -f "${appimage_path}" ]]; then
            echo "Expected AppImage package was not produced: ${appimage_path}" >&2
            exit 1
          fi
          if [[ ! -x "${appimage_path}" ]]; then
            echo "Expected AppImage to be executable: ${appimage_path}" >&2
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == "publish" ]]; then
            if [[ ! -f "${zsync_path}" ]]; then
              echo "Expected AppImage zsync metadata was not produced in publish mode: ${zsync_path}" >&2
              exit 1
            fi
            update_info="$("./${appimage_path}" --appimage-updateinformation 2>/dev/null || true)"
            if [[ -z "${update_info}" ]]; then
              echo "AppImage update information is missing in publish mode." >&2
              exit 1
            fi
            printf 'AppImage update information: %s\n' "${update_info}"
          fi
          
          ls -lh "${appimage_path}"
          if [[ -f "${zsync_path}" ]]; then
            ls -lh "${zsync_path}"
          fi

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-linux-appimage
          path: |
            Nuvio-Linux-x86_64-${{ needs.metadata.outputs.version }}.AppImage
            Nuvio-Linux-x86_64-${{ needs.metadata.outputs.version }}.AppImage.zsync
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create ${{ inputs.mode }} release
    if: inputs.mode != 'build-only' && inputs.mode != 'dry-run' && inputs.target == 'all'
    needs:
      - metadata
      - macos
      - windows
      - linux_flatpak
      - linux_deb
      - linux_rpm
      - linux_appimage
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_COMMIT: ${{ needs.metadata.outputs.release_commit }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nuvio-desktop-${{ needs.metadata.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: |
          release_assets=(
            "release/Nuvio-macOS-arm64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-macOS-x86_64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-Windows-x64-${RELEASE_VERSION}.msi"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.flatpak"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.deb"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.rpm"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage.zsync"
          )
          if [[ ! -s release/release-notes.md ]]; then
            echo "Release notes are missing." >&2
            exit 1
          fi

          : > release/SHA256SUMS.txt
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "${asset}" ]]; then
              echo "Release asset is missing: ${asset}" >&2
              exit 1
            fi
            checksum="$(sha256sum "${asset}" | awk '{print $1}')"
            printf '%s  %s\n' "${checksum}" "$(basename "${asset}")" >> release/SHA256SUMS.txt
          done

          cat release/SHA256SUMS.txt >> "${GITHUB_STEP_SUMMARY}"

      - name: Create GitHub release
        run: |
          release_assets=(
            "release/Nuvio-macOS-arm64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-macOS-x86_64-${RELEASE_VERSION}.dmg"
            "release/Nuvio-Windows-x64-${RELEASE_VERSION}.msi"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.flatpak"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.deb"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.rpm"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage"
            "release/Nuvio-Linux-x86_64-${RELEASE_VERSION}.AppImage.zsync"
            "release/SHA256SUMS.txt"
          )
          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_COMMIT}"
            --title "${RELEASE_VERSION}"
            --notes-file release/release-notes.md
          )
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi
          gh release create --repo "${GITHUB_REPOSITORY}" "${release_args[@]}" "${release_assets[@]}"
