name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts, validate a release, create a draft, or publish
        required: true
        type: choice
        options:
          - build-only
          - dry-run
          - draft
          - publish
        default: dry-run
      target:
        description: Platforms to build in build-only mode
        required: true
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
        default: all
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: ${{ inputs.mode }} ${{ inputs.target }} desktop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      current_bump: ${{ steps.release.outputs.current_bump }}
      previous_bump: ${{ steps.release.outputs.previous_bump }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read release metadata
        id: release
        env:
          VERSION_FILE: composeApp/Configuration/DesktopVersion.properties
          VERSION_KEY: VERSION_NAME
          VERSION_FIRST_PARENT: "true"
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" && "${RELEASE_TARGET}" != "all" ]]; then
            echo "Release validation, draft, and publish modes require target=all." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" != "build-only" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Tag ${RELEASE_TAG} already exists." >&2
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "A GitHub release for ${RELEASE_TAG} already exists." >&2
              exit 1
            fi

            unexpected_changes="$(
              git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
                | grep -Ev '^(\.github/workflows/desktop-release\.yml|scripts/(generate-release-notes|release-metadata)\.sh)$' \
                || true
            )"
            if [[ -n "${unexpected_changes}" ]]; then
              echo "The desktop version bump must be the final application change before release." >&2
              echo "Unexpected files changed after the bump:" >&2
              echo "${unexpected_changes}" >&2
              exit 1
            fi
          fi

      - name: Generate repository release notes
        if: inputs.mode != 'build-only'
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh \
            --from "${PREVIOUS_BUMP}" \
            --to "${CURRENT_BUMP}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-history \
            --exclude "${EXCLUDE_COMMITS}" \
            > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No desktop repository release-note commits were found." >&2
            exit 1
          fi

          {
            echo "## ${{ steps.release.outputs.version }} desktop release notes"
            echo
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release notes
        if: inputs.mode != 'build-only'
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ steps.release.outputs.version }}-release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'macos')
    needs: metadata
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOS_NOTARIZATION_ENABLED: 'false'
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_SHA256: ${{ vars.MACOS_CERTIFICATE_SHA256 }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
      NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
      NUVIO_MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Fetch macOS runtime
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: git lfs pull --include="composeApp/src/desktopMain/native/macos/runtime/${MACOS_ARCH}/**" --exclude=""

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        run: |
          required_values=(
            LOCAL_PROPERTIES_BASE64
            SENTRY_AUTH_TOKEN
            SENTRY_DESKTOP_DSN
          )
          if [[ "${MACOS_NOTARIZATION_ENABLED}" == "true" ]]; then
            required_values+=(
              MACOS_CERTIFICATE_P12_BASE64
              MACOS_CERTIFICATE_PASSWORD
              MACOS_CERTIFICATE_SHA256
              MACOS_NOTARY_APPLE_ID
              MACOS_NOTARY_APP_PASSWORD
              MACOS_NOTARY_TEAM_ID
              NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE
              NUVIO_MACOS_SIGNING_IDENTITY
            )
          fi
          missing=()
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing+=("${value_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required desktop release values: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i '' -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Configure Apple signing and notarization
        if: env.MACOS_NOTARIZATION_ENABLED == 'true'
        run: |
          certificate_path="${RUNNER_TEMP}/nuvio-release.p12"
          keychain_path="${RUNNER_TEMP}/nuvio-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" | base64 --decode > "${certificate_path}"
          chmod 600 "${certificate_path}"

          actual_sha256="$(
            openssl pkcs12 \
              -in "${certificate_path}" \
              -clcerts \
              -nokeys \
              -passin env:MACOS_CERTIFICATE_PASSWORD \
              | openssl x509 -noout -fingerprint -sha256 \
              | sed -E 's/^.*=//; s/://g' \
              | tr '[:upper:]' '[:lower:]'
          )"
          expected_sha256="$(
            printf '%s' "${MACOS_CERTIFICATE_SHA256}" \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [[ "${actual_sha256}" != "${expected_sha256}" ]]; then
            echo "The Apple signing certificate checksum does not match." >&2
            exit 1
          fi

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          security find-identity -v -p codesigning "${keychain_path}" \
            | grep -F "${NUVIO_MACOS_SIGNING_IDENTITY}"

          xcrun notarytool store-credentials \
            "${NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE}" \
            --apple-id "${MACOS_NOTARY_APPLE_ID}" \
            --team-id "${MACOS_NOTARY_TEAM_ID}" \
            --password "${MACOS_NOTARY_APP_PASSWORD}" \
            --keychain "${keychain_path}" \
            --validate

          echo "NUVIO_MACOS_NOTARY_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build, sign, and notarize DMG
        if: env.MACOS_NOTARIZATION_ENABLED == 'true'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          ./gradlew \
            :composeApp:notarizeReleaseDmgWithKeychain \
            :desktopSentry:sentryUploadSourceBundleJava \
            "-Pnuvio.macos.arch=${MACOS_ARCH}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Build unsigned DMG
        if: env.MACOS_NOTARIZATION_ENABLED != 'true'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          NUVIO_MACOS_NOTARY_KEYCHAIN_PROFILE: ''
          NUVIO_MACOS_SIGNING_IDENTITY: ''
        run: |
          ./gradlew \
            :composeApp:packageReleaseDmg \
            :desktopSentry:sentryUploadSourceBundleJava \
            "-Pnuvio.macos.arch=${MACOS_ARCH}" \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

      - name: Verify notarized DMG
        if: env.MACOS_NOTARIZATION_ENABLED == 'true'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Nuvio-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          if [[ ! -f "${dmg_path}" ]]; then
            echo "Expected DMG was not produced: ${dmg_path}" >&2
            exit 1
          fi
          xcrun stapler validate "${dmg_path}"
          codesign --verify --strict --verbose=2 "${dmg_path}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${dmg_path}"

      - name: Verify unsigned DMG
        if: env.MACOS_NOTARIZATION_ENABLED != 'true'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          dmg_path="composeApp/build/compose/release-dmgs/Nuvio-macOS-${MACOS_ARCH}-${RELEASE_VERSION}.dmg"
          if [[ ! -f "${dmg_path}" ]]; then
            echo "Expected DMG was not produced: ${dmg_path}" >&2
            exit 1
          fi
          if codesign --display "${dmg_path}" >/dev/null 2>&1; then
            echo "Expected unsigned DMG, but a code signature was found: ${dmg_path}" >&2
            exit 1
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-macos-${{ matrix.arch }}
          path: composeApp/build/compose/release-dmgs/Nuvio-macOS-${{ matrix.arch }}-${{ needs.metadata.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always() && env.MACOS_NOTARIZATION_ENABLED == 'true'
        run: |
          keychain_path="${RUNNER_TEMP}/nuvio-release.keychain-db"
          if [[ -f "${keychain_path}" ]]; then
            security delete-keychain "${keychain_path}"
          fi
          rm -f "${RUNNER_TEMP}/nuvio-release.p12"

  windows:
    name: Windows x64
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'windows')
    needs: metadata
    runs-on: windows-2022
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      WEBVIEW2_VERSION: 1.0.4078.44
      TORRSERVER_WINDOWS_SHA256: 13031185a54abe0f729f9f3bdb7271a349a89ac8c559327d773c66007ed604f4

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Fetch Windows runtime
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**,composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          if [[ ! -f "${runtime_path}" ]]; then
            echo "The bundled Windows libmpv runtime is missing." >&2
            exit 1
          fi
          runtime_size="$(wc -c < "${runtime_path}")"
          if (( runtime_size < 1000000 )); then
            echo "The bundled Windows libmpv runtime was not materialized from Git LFS." >&2
            exit 1
          fi
          torrserver_path="composeApp/src/desktopMain/resources/torrserver/windows-amd64/TorrServer.exe"
          if [[ ! -f "${torrserver_path}" ]]; then
            echo "The bundled Windows TorrServer executable is missing." >&2
            exit 1
          fi
          torrserver_sha256="$(sha256sum "${torrserver_path}" | awk '{print $1}')"
          if [[ "${torrserver_sha256}" != "${TORRSERVER_WINDOWS_SHA256}" ]]; then
            echo "The bundled Windows TorrServer executable checksum does not match." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          missing=()
          required_values=(
            LOCAL_PROPERTIES_BASE64
            SENTRY_AUTH_TOKEN
            SENTRY_DESKTOP_DSN
          )
          for value_name in "${required_values[@]}"; do
            if [[ -z "${!value_name}" ]]; then
              missing+=("${value_name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required desktop release values: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_(STORE_FILE|STORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD)|NUVIO_MACOS_(SIGNING_IDENTITY|NOTARY_APPLE_ID|NOTARY_TEAM_ID|NOTARY_PASSWORD|NOTARY_KEYCHAIN_PROFILE|NOTARY_KEYCHAIN_PATH))[[:space:]]*=/d' local.properties

          required_properties=(
            NUVIO_SUPABASE_URL
            NUVIO_SUPABASE_ANON_KEY
            TRAKT_CLIENT_ID
            TRAKT_CLIENT_SECRET
          )
          for property_name in "${required_properties[@]}"; do
            if ! grep -Eq "^${property_name}=.+" local.properties; then
              echo "Missing required desktop property: ${property_name}" >&2
              exit 1
            fi
          done

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload `
            -NonInteractive `
            -NoCache

          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          $loaderLibrary = Join-Path $webView2Root "build\native\x64\WebView2Loader.dll.lib"
          if (-not (Test-Path $loaderLibrary)) {
            throw "WebView2Loader.dll.lib was not found at $loaderLibrary"
          }
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            :desktopSentry:sentryUploadSourceBundleJava `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace

      - name: Verify MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $msiRelativePath = "composeApp\build\compose\release-msis\Nuvio-Windows-x64-$env:RELEASE_VERSION.msi"
          if (-not (Test-Path $msiRelativePath)) {
            throw "Expected MSI was not produced: $msiRelativePath"
          }
          $msiPath = (Resolve-Path $msiRelativePath).Path
          $extractDir = Join-Path $env:RUNNER_TEMP "nuvio-msi-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $extractLog = Join-Path $env:RUNNER_TEMP "nuvio-msi-extract.log"
          New-Item -ItemType Directory -Path $extractDir | Out-Null

          $extractArguments = @(
            "/a",
            "`"$msiPath`"",
            "/qn",
            "TARGETDIR=`"$extractDir`"",
            "/l*v",
            "`"$extractLog`""
          )
          $extractProcess = Start-Process `
            -FilePath msiexec.exe `
            -ArgumentList $extractArguments `
            -Wait `
            -PassThru
          if ($extractProcess.ExitCode -ne 0) {
            Get-Content $extractLog -Tail 200
            throw "MSI administrative extraction failed with exit code $($extractProcess.ExitCode)."
          }

          $appJar = Get-ChildItem $extractDir `
            -Recurse `
            -Filter "composeApp-desktop-*.jar" `
            | Select-Object -First 1
          if ($null -eq $appJar) {
            throw "The extracted MSI does not contain the desktop application JAR."
          }

          $jarEntries = & jar tf $appJar.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect the extracted desktop application JAR."
          }
          $requiredEntries = @(
            "native/windows/player_bridge.dll",
            "native/windows/libmpv-2.dll",
            "native/windows/WebView2Loader.dll",
            "native/windows/vcruntime140.dll",
            "native/windows/msvcp140.dll",
            "native/windows/runtime-files.txt",
            "torrserver/windows-amd64/TorrServer.exe"
          )
          foreach ($entry in $requiredEntries) {
            if ($jarEntries -notcontains $entry) {
              throw "The extracted MSI application is missing $entry"
            }
          }

          $javaRuntimeJvm = Get-ChildItem $extractDir `
            -Recurse `
            -Filter "jvm.dll" `
            | Where-Object { $_.FullName -match "[\\/]runtime[\\/]bin[\\/]server[\\/]jvm\.dll$" } `
            | Select-Object -First 1
          if ($null -eq $javaRuntimeJvm) {
            throw "The extracted MSI does not contain the bundled Java runtime."
          }

          $manifestPath = "composeApp\build\compose\release-msis\Nuvio-Windows-x64-$env:RELEASE_VERSION-contents.txt"
          $extractedFiles = Get-ChildItem $extractDir -Recurse -File | Sort-Object FullName
          $nativeEntries = $jarEntries `
            | Where-Object { $_ -like "native/windows/*" } `
            | Sort-Object
          $manifest = [Collections.Generic.List[string]]::new()
          $manifest.Add("MSI=Nuvio-Windows-x64-$env:RELEASE_VERSION.msi")
          $manifest.Add("MSI_SHA256=$((Get-FileHash $msiPath -Algorithm SHA256).Hash.ToLowerInvariant())")
          $manifest.Add("MSI_SIGNATURE_STATUS=$((Get-AuthenticodeSignature $msiPath).Status)")
          $manifest.Add("EXTRACTED_FILE_COUNT=$($extractedFiles.Count)")
          $manifest.Add("APP_JAR=$([IO.Path]::GetRelativePath($extractDir, $appJar.FullName).Replace('\', '/'))")
          $manifest.Add("JAVA_RUNTIME_JVM=$([IO.Path]::GetRelativePath($extractDir, $javaRuntimeJvm.FullName).Replace('\', '/'))")
          $manifest.Add("")
          $manifest.Add("NATIVE_JAR_ENTRIES")
          foreach ($entry in $nativeEntries) {
            $manifest.Add($entry)
          }
          $manifest.Add("")
          $manifest.Add("EXTRACTED_FILES")
          foreach ($file in $extractedFiles) {
            $relativePath = [IO.Path]::GetRelativePath($extractDir, $file.FullName).Replace('\', '/')
            $manifest.Add("$relativePath`t$($file.Length)")
          }
          $manifest | Set-Content $manifestPath -Encoding utf8

          Get-Item $msiPath | Format-List Name, Length, LastWriteTime
          $manifest | Select-Object -First (9 + $nativeEntries.Count)

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-windows-x64
          path: |
            composeApp/build/compose/release-msis/Nuvio-Windows-x64-${{ needs.metadata.outputs.version }}.msi
            composeApp/build/compose/release-msis/Nuvio-Windows-x64-${{ needs.metadata.outputs.version }}-contents.txt
          if-no-files-found: error
          retention-days: 14

  linux_flatpak:
    name: Linux x64 - Flatpak
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'linux')
    needs: metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          bash ./scripts/linux/install-desktop-build-dependencies.sh

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          bash ./scripts/linux/configure-desktop-runtime.sh

      - name: Build Linux app bundle
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:createReleaseDistributable \
            :desktopSentry:sentryUploadSourceBundleJava \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

          app_root="${GITHUB_WORKSPACE}/composeApp/build/compose/binaries/main-release/app/Nuvio"
          if [[ ! -d "${app_root}" ]]; then
            echo "Expected the Linux app bundle at ${app_root} after createReleaseDistributable." >&2
            find composeApp/build/compose -maxdepth 6 2>/dev/null | head -n 200 >&2
            exit 1
          fi

          executable_path="${app_root}/bin/Nuvio"
          if [[ ! -x "${executable_path}" ]]; then
            executable_path="${app_root}/bin/nuvio"
          fi
          if [[ ! -x "${executable_path}" ]]; then
            echo "Expected a Linux app executable under ${app_root}/bin after createReleaseDistributable." >&2
            find "${app_root}" -maxdepth 3 2>/dev/null | head -n 200 >&2
            exit 1
          fi

      - name: Install Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils

          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --system flathub org.gnome.Platform//50 org.gnome.Sdk//50
          sudo flatpak install -y --system flathub org.freedesktop.Platform.VAAPI.Intel//25.08 || true
          sudo flatpak install -y --system flathub org.freedesktop.Platform.VAAPI.Nvidia//25.08 || true

      - name: Build Linux Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          app_root="${GITHUB_WORKSPACE}/composeApp/build/compose/binaries/main-release/app/Nuvio"
          alt_app_root="${GITHUB_WORKSPACE}/composeApp/build/compose/binaries/main-release/app/Nuvio/Nuvio"
          if [[ -d "${alt_app_root}" ]]; then
            app_root="${alt_app_root}"
          fi

          if [[ ! -d "${app_root}" ]]; then
            echo "Expected the Linux app bundle at ${app_root}." >&2
            find composeApp/build/compose -maxdepth 8 2>/dev/null | head -n 300 >&2
            exit 1
          fi

          executable_path="${app_root}/bin/Nuvio"
          if [[ ! -x "${executable_path}" ]]; then
            executable_path="${app_root}/bin/nuvio"
          fi
          if [[ ! -x "${executable_path}" ]]; then
            echo "Expected a Linux app executable under ${app_root}/bin." >&2
            find "${app_root}" -maxdepth 4 2>/dev/null | head -n 300 >&2
            exit 1
          fi

          mkdir -p flatpak
          cp ./scripts/linux/nuvio-launcher.sh flatpak/nuvio-launcher.sh
          cp ./scripts/linux/linux-shortcut-definition.sh flatpak/linux-shortcut-definition.sh
          cp ./scripts/linux/com.nuvio.media.desktop.metainfo.xml flatpak/com.nuvio.media.desktop.metainfo.xml
          chmod +x flatpak/nuvio-launcher.sh
          release_date="$(date -u +%F)"
          sed -i "s|version=\"0.0.0\"|version=\"${RELEASE_VERSION}\"|" flatpak/com.nuvio.media.desktop.metainfo.xml
          sed -i "s|date=\"1970-01-01\"|date=\"${release_date}\"|" flatpak/com.nuvio.media.desktop.metainfo.xml
          
          cp ./scripts/linux/nuvio-flatpak.yml flatpak/nuvio-flatpak.yml
          sed -i "s|\${app_root}|${app_root}|g" flatpak/nuvio-flatpak.yml
          
          flatpak-builder --repo=flatpak-repo --force-clean flatpak-build flatpak/nuvio-flatpak.yml
          flatpak build-bundle flatpak-repo "Nuvio-Linux-x86_64-${RELEASE_VERSION}.flatpak" com.nuvio.media.desktop

      - name: Verify Flatpak
        shell: bash
        run: |
          set -euo pipefail
          flatpak_path="Nuvio-Linux-x86_64-${RELEASE_VERSION}.flatpak"
          if [[ ! -f "${flatpak_path}" ]]; then
            echo "Expected Flatpak bundle was not produced: ${flatpak_path}" >&2
            exit 1
          fi
          ls -lh "${flatpak_path}"

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-linux-flatpak
          path: Nuvio-Linux-x86_64-${{ needs.metadata.outputs.version }}.flatpak
          if-no-files-found: error
          retention-days: 14

  linux_deb:
    name: Linux x64 - DEB
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'linux')
    needs:
      - metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install Linux DEB build dependencies
        run: |
          bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          bash ./scripts/linux/configure-desktop-runtime.sh

      - name: Build Linux DEB
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:packageReleaseDeb \
            :desktopSentry:sentryUploadSourceBundleJava \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

          deb_dir="${GITHUB_WORKSPACE}/composeApp/build/compose/binaries/main-release/deb"
          if [[ ! -d "${deb_dir}" ]]; then
            echo "Expected DEB output directory at ${deb_dir}." >&2
            find composeApp/build/compose -maxdepth 8 2>/dev/null | head -n 300 >&2
            exit 1
          fi

          mapfile -t debs < <(find "${deb_dir}" -maxdepth 1 -type f -name '*.deb' | sort)
          if [[ "${#debs[@]}" -ne 1 ]]; then
            echo "Expected exactly one .deb in ${deb_dir}, found ${#debs[@]}." >&2
            ls -la "${deb_dir}" >&2 || true
            exit 1
          fi

          cp "${debs[0]}" "Nuvio-Linux-x86_64-${RELEASE_VERSION}.deb"

      - name: Verify DEB
        shell: bash
        run: |
          set -euo pipefail
          deb_path="Nuvio-Linux-x86_64-${RELEASE_VERSION}.deb"
          if [[ ! -f "${deb_path}" ]]; then
            echo "Expected DEB package was not produced: ${deb_path}" >&2
            exit 1
          fi
          bash ./scripts/linux/verify-linux-deb.sh "${deb_path}"
          ls -lh "${deb_path}"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-desktop-${{ needs.metadata.outputs.version }}-linux-deb
          path: Nuvio-Linux-x86_64-${{ needs.metadata.outputs.version }}.deb
          if-no-files-found: error
          retention-days: 14

  linux_rpm:
    name: Linux x64 - RPM
    if: inputs.mode != 'dry-run' && (inputs.target == 'all' || inputs.target == 'linux')
    needs:
      - metadata
    runs-on: ubuntu-latest
    environment: desktop-release
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_DESKTOP_LOCAL_PROPERTIES_BASE64 }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Install Linux RPM build dependencies
        run: |
          bash ./scripts/linux/install-desktop-build-dependencies.sh fakeroot rpm cpio

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure desktop runtime
        shell: bash
        run: |
          bash ./scripts/linux/configure-desktop-runtime.sh

      - name: Build Linux RPM
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :composeApp:packageReleaseRpm \
            :desktopSentry:sentryUploadSourceBundleJava \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace

          rpm_dir="${GITHUB_WORKSPACE}/composeApp/build/compose/binaries/main-release/rpm"
          if [[ ! -d "${rpm_dir}" ]]; then
            echo "Expected RPM output directory at ${rpm_dir}." >&2
            find composeApp/build/compose -maxdepth 8 2>/dev/null | head -n 300 >&2
            exit 1
          fi

          mapfile -t rpms < <(find "${rpm_dir}" -maxdepth 1 -type f -name '*.rpm' | sort)
          if [[ "${#rpms[@]}" -ne 1 ]]; then
            echo "Expected exactly one .rpm in ${rpm_dir}, found ${#rpms[@]}." >&2
            ls -la "${rpm_dir}" >&2 || true
            exit 1
          fi

          cp "${rpms[0]}" "Nuvio-Linux-x86_64-${RELEASE_VERSION}.rpm"

      - name: Verify RPM
        shell: bash
        run: |
          set -euo pipefail
          rpm_path="Nuvio-Linux-x86_64-${RELEASE_VERSION}.rpm"
          if [[ ! -f "${rpm_path}" ]]; then
            echo "Expected RPM package was not produced: ${rpm_path}" >&2
