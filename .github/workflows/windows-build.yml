name: Build Windows Desktop

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true


    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up MSVC (for C++ Bridge)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache NuGet packages (WebView2 SDK)
      uses: actions/cache@v4
      with:
        path: ~\.nuget\packages
        key: nuget-webview2-1.0.2592.51
        restore-keys: nuget-webview2-

    - name: Install WebView2 SDK
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory "$env:USERPROFILE\.nuget\packages"

    - name: Cache Gradle build outputs
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          composeApp/build/native/windows
        key: gradle-windows-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-windows-

    - name: Create local.properties
      shell: pwsh
      run: |
        New-Item -Path local.properties -ItemType File -Force
        Add-Content -Path local.properties -Value "INTRODB_API_URL=https://api.introdb.app"

    - name: Compute build version
      id: version
      shell: pwsh
      run: |
        $version = "1.0.${{ github.run_number }}"
        echo "name=$version" >> $env:GITHUB_OUTPUT
        echo "NUVIO_DESKTOP_VERSION_NAME=$version" >> $env:GITHUB_ENV
        echo "NUVIO_DESKTOP_VERSION_CODE=${{ github.run_number }}" >> $env:GITHUB_ENV

    - name: Build Windows Player Bridge
      run: ./gradlew.bat :composeApp:buildWindowsPlayerBridge

    - name: Build Windows MSI
      run: >-
        ./gradlew.bat
        :composeApp:packageReleaseMsi
        --no-configuration-cache

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "windows-v${{ steps.version.outputs.name }}"
        name: "Windows Desktop v${{ steps.version.outputs.name }}"
        draft: false
        prerelease: true
        files: composeApp/build/compose/binaries/main-release/msi/Nuvio-Windows-*.msi
