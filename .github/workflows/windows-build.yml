name: Build Windows Desktop

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up MSVC (for C++ Bridge)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install WebView2 SDK
      run: nuget install Microsoft.Web.WebView2 -Version 1.0.2592.51 -OutputDirectory ~/.nuget/packages

    - name: Build Windows Player Bridge
      run: ./gradlew.bat :composeApp:buildWindowsPlayerBridge

    - name: Build Windows Installer (MSI)
      run: ./gradlew.bat :composeApp:packageReleaseDistributionForCurrentOS

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuvio-windows-build
        path: |
          composeApp/build/compose/binaries/main/msi/*.msi
          composeApp/build/compose/binaries/main/release/msi/*.msi
